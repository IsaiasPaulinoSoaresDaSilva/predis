server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota cai de volta em index.html (Vue Router não está em
    # uso hoje, mas isso mantém o comportamento correto se for adicionado).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
