services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Em produção, restrinja para a(s) origem(ns) real(is) do frontend —
      # ver IMPLEMENTATION_PLAN.md, Fase 3.
      - ALLOWED_ORIGINS=*
    volumes:
      # Persiste entre restarts/rebuilds do container: o modelo treinado
      # (evita retreinar a cada `docker compose up`) e o histórico de
      # predições em SQLite (backend/data/disaster_model.joblib e
      # backend/data/predis.db — ver backend/database.py e backend/model.py).
      - predis-data:/app/backend/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # A app roda no navegador do usuário, não dentro da rede Docker —
        # por isso aponta para o backend via localhost (porta publicada
        # acima), não para o nome do serviço "backend".
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  predis-data:
